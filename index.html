<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaditya Kasture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --dim:#8a8a8a; --bg:#fbfbf9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:400 12px/1.6 "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.02em; -webkit-font-smoothing:antialiased; }
  header { max-width:640px; margin:0 auto; padding:72px 24px 96px; display:flex; justify-content:space-between; align-items:baseline; }
  header span { color:var(--dim); }
  main { max-width:640px; margin:0 auto; padding:0 24px; }
  figure { margin:0 0 112px; }
  img { display:block; width:100%; height:auto; background:#eee; }
  figcaption { margin-top:10px; font-size:11px; display:flex; gap:16px; align-items:baseline; }
  figcaption .n { color:var(--dim); }
  figcaption .t { flex:1; }
  figcaption .m { color:var(--dim); text-align:right; }
  @media (max-width:520px) { figcaption { flex-wrap:wrap; gap:4px 12px; } figcaption .m { flex-basis:100%; text-align:left; padding-left:28px; } }
  footer { max-width:640px; margin:0 auto; padding:0 24px 72px; color:var(--dim); font-size:11px; }
  @media (max-width:520px) { header { padding:48px 20px 64px; } main, footer { padding-left:20px; padding-right:20px; } figure { margin-bottom:72px; } }
</style>
</head>
<body>
  <header><div>Aaditya Kasture</div><span>my photographs</span></header>
  <main>
    <figure><img src="img/p02.jpg" alt="Honda Accord Wagon" loading="eager"><figcaption><span class="n">01</span><span class="t">More than meets the eye (Honda Accord Wagon)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p05.jpg" alt="Ferrari LaFerrari" loading="eager"><figcaption><span class="n">02</span><span class="t">Head-turner (Ferrari LaFerrari)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/g1.jpg" alt="Guam plate on a Land Rover Defender" loading="lazy"><figcaption><span class="n">03</span><span class="t">A long way from Guam (Land Rover Defender)</span><span class="m">Lansdowne, VA</span></figcaption></figure>
    <figure><img src="img/n1.jpg" alt="Porsche 911 Carrera" loading="lazy"><figcaption><span class="n">04</span><span class="t">Bring your own shade (Porsche 911 Carrera, G-Body)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p01.jpg" alt="Toyota Land Cruiser" loading="lazy"><figcaption><span class="n">05</span><span class="t">Suburban safari (Toyota Land Cruiser FJ70)</span><span class="m">Ashburn, VA</span></figcaption></figure>
    <figure><img src="img/p11.jpg" alt="BMW M3 (E46), pair" loading="lazy"><figcaption><span class="n">06</span><span class="t">Two of a kind (BMW M3, E46)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p06.jpg" alt="BMW 8 Series (E31)" loading="lazy"><figcaption><span class="n">07</span><span class="t">The quiet one in the crowd (BMW 8 Series, E31)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p10.jpg" alt="Toyota Supra (A80)" loading="lazy"><figcaption><span class="n">08</span><span class="t">Still the poster car (Toyota Supra, A80)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/n2.jpg" alt="Nissan Skyline GT-R (R34)" loading="lazy"><figcaption><span class="n">09</span><span class="t">Under the canopy (Nissan Skyline GT-R, R34)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p09.jpg" alt="Mercedes-Benz 190 SL" loading="lazy"><figcaption><span class="n">10</span><span class="t">Older than everyone watching (Mercedes-Benz 190 SL)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p07.jpg" alt="Land Rover Defender" loading="lazy"><figcaption><span class="n">11</span><span class="t">Built to be used (Land Rover Defender)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p08.jpg" alt="Lamborghini Hurac&aacute;n" loading="lazy"><figcaption><span class="n">12</span><span class="t">Loudest color in the lot (Lamborghini Hurac&aacute;n)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/n3.jpg" alt="1957 Chevrolet Wagon" loading="lazy"><figcaption><span class="n">13</span><span class="t">Saved a seat (1957 Chevrolet Handyman)</span><span class="m">Ashburn, VA</span></figcaption></figure>
    <figure><img src="img/n4.jpg" alt="Porsche 911 Cabriolet (993)" loading="lazy"><figcaption><span class="n">14</span><span class="t">Last of the air-cooled (Porsche 993 Cabriolet)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/n5.jpg" alt="Porsche 718 Cayman GT4 RS" loading="lazy"><figcaption><span class="n">15</span><span class="t">Just pulling in (Porsche 718 Cayman GT4 RS)</span><span class="m">Great Falls, VA</span></figcaption></figure>
    <figure><img src="img/p03.jpg" alt="Pope-Leighey House, Frank Lloyd Wright" loading="lazy"><figcaption><span class="n">16</span><span class="t">Built small on purpose (Pope-Leighey House, Frank Lloyd Wright)</span><span class="m">Alexandria, VA</span></figcaption></figure>
    <figure><img src="img/n6.jpg" alt="Mountain overlook at sunset" loading="lazy"><figcaption><span class="n">17</span><span class="t">First light (sunrise)</span><span class="m">Skyline Drive, VA</span></figcaption></figure>
  </main>
  <footer>17 frames</footer>
</body>
</html>
